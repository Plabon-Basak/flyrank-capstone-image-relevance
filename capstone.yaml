run: "python -m uvicorn app.main:app --host 127.0.0.1 --port 8000"
seed: null
test: "python -m pytest -q"
base_url: "http://127.0.0.1:8000"

endpoints:
  - method: GET
    path: /health
  - method: POST
    path: /images
  - method: POST
    path: /images/upload
  - method: GET
    path: /images
  - method: GET
    path: /images/{image_id}/matches
  - method: POST
    path: /blog-posts
  - method: POST
    path: /batch-jobs
  - method: GET
    path: /match-suggestions
  - method: POST
    path: /match-suggestions/{suggestion_id}/review
